# Vale: the documentation site's house style, the same as the aprscaching manual's. The docs workflow runs it; an
# error (filler words, terminology variants) fails the build, a warning or suggestion is shown.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Ham

[formats]
md = md

[docs/**/*.md]
BasedOnStyles = Vale, APRScaching
# British and American spellings both occur, and the ham vocabulary is large; spelling is left to review.
Vale.Spelling = NO
# A repeated word across a code span or a table cell is not a typo.
Vale.Repetition = NO
