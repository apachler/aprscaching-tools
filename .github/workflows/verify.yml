name: verify

# On dev, a changed tool stays unsigned until the next release: verify lists unsigned or stale signatures without
# failing, and the tests report a tool folder without a registry entry as a warning. main holds only fully signed,
# listed states: there, and in PRs into it, every signature must hold (--strict) and every tool must be listed
# (STRICT=1). A PR into main is a release, so it comes from a release/vX.Y.Z branch; verify is a required check there.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: a PR into main comes from a release branch
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] && exit 0
          echo "::error::a pull request into main comes from release/vX.Y.Z, not from $HEAD_REF: retarget it to dev"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # pnpm is pinned through packageManager; the lockfile is frozen and pnpm-workspace.yaml holds the release-age
      # floor. No dependency runs an install script: esbuild ships its binary as an optional package.
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      # ESLint for code mistakes, Prettier for the layout (Markdown and the signed and built files are left out)
      - run: pnpm lint
      # The MIT libraries the tools bundle, from APRScaching at the commit lib.lock pins.
      - run: node scripts/fetch-libs.mjs
      # Every committed tool.js must be exactly what its sources build to, so the signed bytes are the reviewed ones.
      - run: node scripts/build.mjs --check
      # STRICT=1 on main and in PRs into it: a tool folder without a registry entry fails instead of warning
      - run: pnpm test
        env:
          STRICT: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && '1' || '' }}
      # The registry against the authority key in authority.pub, every listed tool against its author key.
      - name: verify (dev, unsigned tools listed)
        if: github.base_ref != 'main' && github.ref != 'refs/heads/main'
        run: node scripts/verify.mjs
      - name: verify --strict (main)
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: node scripts/verify.mjs --strict
