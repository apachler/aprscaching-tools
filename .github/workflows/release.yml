name: Release

# A pushed v* tag on main becomes a GitHub Release. The tag is made by the maintainer after the signed release
# merged into main; the notes come from CHANGELOG.md's section for that version. The release carries the registry as
# an archive, its SHA-256 and a build-provenance attestation (Sigstore, in-toto) that names this workflow run. Releases
# are immutable: the release is made as a draft with its files, then published, and stays as published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Everything that runs the repository's or a dependency's code runs here, with a read-only token, so no such code
  # ever sits beside the token that writes releases or the one that asks for a provenance certificate.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify every signature at the tag
        run: node scripts/verify.mjs --strict
      # The repository checks, strict: every tool folder at the tag has its registry entry
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - name: Repository checks (STRICT=1)
        env:
          STRICT: "1"
        run: pnpm exec vitest run test/repository.test.mjs

  release:
    needs: check
    runs-on: ubuntu-latest
    # what this job alone needs: the release itself, and the provenance attestation (a Sigstore certificate for this
    # run, stored with the repository's attestations). It runs git, the attest action and gh, nothing of the
    # repository's own.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # What an instance reads at the tag: the registry, the authority key, the licence and the tools
      - name: The registry archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="aprscaching-tools-$TAG/" -o "aprscaching-tools-$TAG.tar.gz" "$TAG" \
            registry.json authority.pub LICENSE tools
          sha256sum "aprscaching-tools-$TAG.tar.gz" > "aprscaching-tools-$TAG.tar.gz.sha256"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: aprscaching-tools-${{ github.ref_name }}.tar.gz
      # The notes are CHANGELOG.md's section for the version, matched as plain text (a version's dots are no
      # pattern); a tag without its section fails rather than publishing empty notes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          notes="$(awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section '## [${TAG#v}]' with notes"
            exit 1
          fi
          cp "$BUNDLE" "aprscaching-tools-$TAG.tar.gz.intoto.jsonl"
          gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag --draft \
            "aprscaching-tools-$TAG.tar.gz" "aprscaching-tools-$TAG.tar.gz.sha256" "aprscaching-tools-$TAG.tar.gz.intoto.jsonl"
          gh release edit "$TAG" --draft=false
